<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="300"
   height="300"
   viewBox="0 0 300 300"
   version="1.1"
   id="atomi-logo"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient
       id="orbit"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop offset="0" style="stop-color:#33fee0;stop-opacity:1" />
      <stop offset="0.55" style="stop-color:#22e6e6;stop-opacity:1" />
      <stop offset="1" style="stop-color:#61ce96;stop-opacity:1" />
    </linearGradient>
    <linearGradient
       id="core"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop offset="0" style="stop-color:#9bfff2;stop-opacity:1" />
      <stop offset="0.5" style="stop-color:#33fee0;stop-opacity:1" />
      <stop offset="1" style="stop-color:#00d9c0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g
     id="mark"
     fill="none"
     stroke="url(#orbit)"
     stroke-width="16"
     stroke-linecap="round">
    <ellipse cx="150" cy="150" rx="44" ry="116" />
    <ellipse cx="150" cy="150" rx="44" ry="116" transform="rotate(60 150 150)" />
    <ellipse cx="150" cy="150" rx="44" ry="116" transform="rotate(120 150 150)" />
  </g>
  <circle cx="150" cy="150" r="19" fill="url(#core)" />
</svg>
